html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<script id="mobile-shell-code">
// UI is independent of engine initialization, including the loading/error screens.
(function () {
	'use strict';
	const fullscreenButton = document.getElementById('mobile-fullscreen');
	const installButton = document.getElementById('mobile-install');
	const help = document.getElementById('mobile-help');
	const helpText = document.getElementById('mobile-help-text');
	const standalone = window.matchMedia('(display-mode: standalone)');
	const fullscreenDisplay = window.matchMedia('(display-mode: fullscreen)');
	let installPrompt = null;
	let installed = false;
	const installHelp = 'No iPhone: abra no Safari, toque em Compartilhar (ou no menu da página e depois Compartilhar), escolha Adicionar à Tela de Início e ative Abrir como App, se aparecer. Depois, abra pelo ícone criado. Em outros navegadores, procure Instalar app no menu. A opção depende do navegador e do site.';

	function showHelp(message) {
		helpText.textContent = message;
		help.hidden = false;
		document.getElementById('mobile-close').focus();
	}
	function closeHelp() {
		help.hidden = true;
		document.getElementById('canvas').focus();
	}
	function isInstalled() {
		return installed || standalone.matches || fullscreenDisplay.matches || navigator.standalone === true;
	}
	function updateControls() {
		const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
		const fullscreenLabel = active ? 'Sair da tela cheia' : 'Tela cheia';
		fullscreenButton.setAttribute('aria-label', fullscreenLabel);
		fullscreenButton.setAttribute('title', fullscreenLabel);
		document.getElementById('mobile-fullscreen-icon').setAttribute('d', active ? 'M3 8h5V3m8 0v5h5M8 21v-5H3m13 5v-5h5' : 'M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5');
		fullscreenButton.setAttribute('aria-pressed', String(active));
		installButton.hidden = isInstalled();
		const installLabel = installPrompt ? 'Instalar jogo' : 'Instalar / ajuda';
		installButton.setAttribute('aria-label', installLabel);
		installButton.setAttribute('title', installLabel);
		document.getElementById('mobile-install-icon').setAttribute('d', installPrompt ? 'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5' : 'M3 11l9-8 9 8M5 10v11h5v-7h4v7h5V10');
	}
	async function toggleFullscreen() {
		const active = document.fullscreenElement || document.webkitFullscreenElement;
		const root = document.documentElement;
		const request = root.requestFullscreen || root.webkitRequestFullscreen;
		const exit = document.exitFullscreen || document.webkitExitFullscreen;
		try {
			if (active && exit) {
				await exit.call(document);
			} else if (request && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
				// Fullscreen the document so the exit button stays reachable.
				await request.call(root);
			} else {
				showHelp(isInstalled() ? 'O jogo já está aberto como app. A tela cheia adicional depende do navegador. Gire o celular para jogar na horizontal.' : 'Este navegador não oferece tela cheia para o jogo. ' + installHelp);
			}
		} catch {
			showHelp('O navegador não permitiu ativar ou sair da tela cheia. ' + installHelp);
		}
		updateControls();
	}
	async function installGame() {
		if (!installPrompt) {
			showHelp(installHelp);
			return;
		}
		const prompt = installPrompt;
		installPrompt = null;
		installButton.disabled = true;
		try {
			await prompt.prompt();
		} catch {
			showHelp('Não foi possível abrir a instalação. ' + installHelp);
		} finally {
			installButton.disabled = false;
			updateControls();
		}
	}
	window.addEventListener('beforeinstallprompt', function (event) {
		event.preventDefault();
		installPrompt = event;
		updateControls();
	});
	window.addEventListener('appinstalled', function () {
		installed = true;
		installPrompt = null;
		closeHelp();
		updateControls();
	});
	for (const query of [standalone, fullscreenDisplay]) {
		if (query.addEventListener) query.addEventListener('change', updateControls);
	}
	document.addEventListener('fullscreenchange', updateControls);
	document.addEventListener('webkitfullscreenchange', updateControls);
	document.addEventListener('keydown', function (event) {
		if (event.key === 'Escape' && !help.hidden) closeHelp();
	});
	fullscreenButton.addEventListener('click', toggleFullscreen);
	installButton.addEventListener('click', installGame);
	document.getElementById('mobile-close').addEventListener('click', closeHelp);
	updateControls();
}());

	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({

					statusProgress.max = total;

				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
